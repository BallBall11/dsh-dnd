# dsh-dnd bundle patch — the `dsh.bundle.patch` layer of this package.
#
# Installed with:
#
#   dsh plugin --profile web add link:D:/DND/dsh-dnd-bundle
#   dsh plugin --profile web add dsh-dnd@<version>        # once published
#
# The row is a BARE PACKAGE NAME, matching how every reference plugin in
# D:\Code\dsh-web does it (see packages/dsh-task-board/cordis.patch.yml):
#
#   - the node half (package.json exports["."]) runs in the host process,
#   - the `dsh.client` declaration in package.json makes the browser half
#     (exports["./client"], served at /plugins/dsh-dnd/client.js) load in the
#     web GUI.
#
# Do NOT replace `name` with a relative path like ./lib/host/index.mjs. That
# works by accident for a single row but bypasses package resolution, and it is
# how v0.1.0 ended up needing a hand-written coordinator to dodge
# `dsh-client-modules: package dsh-dnd resolves from multiple active Loader
# sources` — a bare name resolves once, through exports, so the problem cannot
# arise in the first place.
- insert:
    - id: dnd
      name: dsh-dnd
